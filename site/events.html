<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events & Calendar — Satyaseva Catechist Sisters</title>
  <meta name="description" content="Upcoming events, feasts, and community gatherings of the Satyaseva Catechist Sisters of the Families.">
  <link rel="canonical" href="https://satyasevasisters.org/events.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    .events-list {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .event-card {
      background: var(--card);
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      padding: 24px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .event-card:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .event-date {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink);
      border-bottom: 2px solid var(--ink);
      padding-bottom: 8px;
      margin-bottom: 16px;
      display: inline-block;
    }
    .event-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .event-details {
      font-size: 13px;
      color: var(--ink-soft);
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .event-desc {
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-soft);
      margin: 0;
    }
    .empty-state {
      text-align: center;
      padding: 60px;
      border: 2px dashed var(--ink-faint);
      color: var(--ink-soft);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <nav id="nav" role="navigation">
    <div class="nav-pill">
      <a href="index.html" class="brand" style="text-decoration:none; color:inherit;">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 1v18M3 6h14"/></svg><span>Satyaseva <span class="brand-full">Catechist </span>Sisters</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="communities.html">Communities</a>
        <a href="map.html">Map</a>
        <a href="events.html" style="background:var(--gold-glow);border:2px solid var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink);">Events</a>
        <a href="news.html">News</a>
        <a href="vocations.html">Vocations</a>
        <a href="prayers.html">Prayers</a>
        <a href="donate.html" style="color:#0891b2; font-weight:600;">Donate</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="nav-actions">
        <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle Dark/Light Mode">🌙</button>
      </div>
    </div>
  </nav>

  <main id="main-content">
    <div class="nav-header">
      <div class="nav-header-inner">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h1 style="font-family:'Playfair Display',serif; font-size:20px; font-weight:700; margin:0;">Events & Calendar</h1>
      </div>
    </div>

    <section class="events-list" id="events-container">
      <div class="empty-state">Loading events...</div>
    </section>
  </main>

  <footer>
    <div class="footer-glass">
      <svg class="cross-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M5 8h14"/></svg>
      <h3>Satyaseva Catechist Sisters of the Families</h3>
      <p>Service to God's Truth since 1976.</p>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="impressum.html">Impressum</a>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('/api/events')
        .then(r => r.json())
        .then(events => {
          const container = document.getElementById('events-container');
          if (!Array.isArray(events) || events.length === 0) {
            container.innerHTML = '<div class="empty-state">No upcoming events scheduled at this time. Please check back later.</div>';
            return;
          }
          let html = '';
          events.forEach(e => {
            const d = new Date(e.date);
            const dateStr = isNaN(d) ? e.date : d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            html += `
              <div class="event-card reveal visible">
                <div class="event-date">${dateStr}</div>
                <h3 class="event-title">${e.title}</h3>
                <div class="event-details">
                  ${e.time ? `<span>⏱ ${e.time}</span>` : ''}
                  ${e.location ? `<span>📍 ${e.location}</span>` : ''}
                </div>
                <p class="event-desc">${e.description || ''}</p>
              </div>
            `;
          });
          container.innerHTML = html;
        })
        .catch(err => {
          document.getElementById('events-container').innerHTML = '<div class="empty-state">Unable to load events.</div>';
          console.error(err);
        });
    });
  </script>
  <script src="js/main.js" defer></script>
</body>
</html>
