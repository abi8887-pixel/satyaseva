name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sync images and generate fallback data (optional)
        run: |
          if [ -f scripts/sync_images.py ]; then python3 scripts/sync_images.py || true; fi
          python3 - <<'PY'
          import json, os
          c = os.path.join('site', 'data', 'communities.json')
          m = os.path.join('site', 'data', 'memorial.json')
          out = os.path.join('site', 'data', 'communities-data.js')
          if os.path.exists(c) and os.path.exists(m):
              with open(c, encoding='utf-8') as f: comm = json.load(f)
              with open(m, encoding='utf-8') as f: mem = json.load(f)
              with open(out, 'w', encoding='utf-8') as f:
                  f.write('// Auto-generated fallback data\n')
                  f.write('window.__INITIAL_COMMUNITIES__ = ' + json.dumps(comm) + ';\n')
                  f.write('window.__INITIAL_MEMORIAL__ = ' + json.dumps(mem) + ';\n')
              print('Fallback dataset updated')
          else:
              print('Skipping fallback dataset: data files not found')
          PY

      - name: Remove sensitive data and backups
        run: |
          rm -rf site/data/backups scripts/data/backups || true
          rm -f site/data/*.db scripts/data/*.db *.db scripts/data/.admin_hash || true

      - name: Verify site folder
        run: |
          test -f site/index.html || (echo "site/index.html missing" && ls -la && exit 1)
          touch site/.nojekyll

      - name: Stage clean copy of site
        run: |
          rm -rf _site
          mkdir _site
          # regular files only: skips symlinks/special files that break tar
          rsync -rt --no-links --exclude '.git' site/ _site/
          chmod -R a+rX _site
          find _site -type f | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
